services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Copy .env.example to .env and set DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20.3
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      STORAGE_BACKEND: local
      STORAGE_ROOT_DIR: /var/lib/printair/storage
      COOKIE_SECURE: ${COOKIE_SECURE}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:5173}
      SHOP_QUOTA_BYTES: ${SHOP_QUOTA_BYTES:-1073741824}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@printair.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      BOOTSTRAP_SHOP_SLUG: ${BOOTSTRAP_SHOP_SLUG}
      BOOTSTRAP_SHOP_NAME: ${BOOTSTRAP_SHOP_NAME}
      BOOTSTRAP_OPERATOR_EMAIL: ${BOOTSTRAP_OPERATOR_EMAIL}
      BOOTSTRAP_OPERATOR_PASSWORD: ${BOOTSTRAP_OPERATOR_PASSWORD}
      RETENTION_HOURS: ${RETENTION_HOURS}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - printair-storage:/var/lib/printair/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15

  conversion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: conversion-worker
    command: ["--spring.profiles.active=worker"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      STORAGE_BACKEND: local
      STORAGE_ROOT_DIR: /var/lib/printair/storage
      COOKIE_SECURE: ${COOKIE_SECURE}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - printair-storage:/var/lib/printair/storage
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m

  dashboard:
    build:
      context: .
      dockerfile: frontend/dashboard/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  submit:
    build:
      context: .
      dockerfile: frontend/submit/Dockerfile
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  printair-storage:
